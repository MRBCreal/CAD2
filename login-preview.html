<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD - Sistema de Despacho - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1a3580 100%);
        }

        .login-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Side - Brand Section */
        .brand-section {
            width: 40%;
            background: linear-gradient(135deg, #1e40af 0%, #1a3580 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }

        .brand-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,107,53,0.1) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .brand-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 400px;
        }

        .brand-logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-benefits {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .benefit-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid #ff6b35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        /* Right Side - Login Form */
        .form-section {
            width: 60%;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
        }

        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 53, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .form-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #999;
            transition: color 0.2s ease;
            background: none;
            border: none;
            padding: 4px;
        }

        .toggle-password:hover {
            color: #1e40af;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1e40af;
        }

        .checkbox-group label {
            font-size: 14px;
            color: #666;
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .submit-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #1e40af 0%, #1a3580 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.25);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.35);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot-password a {
            font-size: 13px;
            color: #1e40af;
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .forgot-password a:hover {
            color: #1a3580;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            font-size: 13px;
            color: #999;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e5e7eb;
            z-index: 0;
        }

        .divider span {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            position: relative;
            z-index: 1;
            padding: 0 8px;
        }

        .signup-text {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .signup-text a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signup-text a:hover {
            color: #e55a24;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .login-container {
                flex-direction: column;
            }

            .brand-section {
                width: 100%;
                padding: 40px 30px;
                min-height: 250px;
            }

            .form-section {
                width: 100%;
                padding: 40px 20px;
            }

            .form-wrapper {
                max-width: 350px;
            }
        }

        @media (max-width: 640px) {
            .brand-section {
                padding: 30px 20px;
                min-height: 200px;
            }

            .brand-logo {
                font-size: 36px;
            }

            .brand-title {
                font-size: 24px;
            }

            .form-section {
                padding: 20px;
            }

            .form-wrapper {
                max-width: 100%;
            }

            .form-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Brand -->
        <div class="brand-section">
            <div class="brand-content">
                <div class="brand-logo">CAD</div>
                <h1 class="brand-title">Sistema de Despacho</h1>
                <p class="brand-subtitle">Gestión de incidentes y unidades en tiempo real</p>

                <div class="brand-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">✓</div>
                        <span>Seguridad empresarial</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">✓</div>
                        <span>Operación 24/7</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">✓</div>
                        <span>Respuesta en tiempo real</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="form-section">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Iniciar Sesión</h2>
                    <p>Ingresa tus credenciales para acceder</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="tu@correo.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <span id="toggleIcon">👁️</span>
                            </button>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme en este dispositivo</label>
                    </div>

                    <button type="submit" class="submit-btn">Iniciar Sesión</button>
                </form>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="divider">
                    <span>¿Eres nuevo?</span>
                </div>

                <div class="signup-text">
                    Registrate aquí → <a href="#">Crear cuenta</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const remember = document.getElementById('remember').checked;

            alert(`Login attempt:\nEmail: ${email}\nRemember: ${remember}`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Central de Seguridad Ciudadana - Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom Glassmorphism styles that go slightly beyond utility classes for finer control */
        .glass-panel {
            background: rgba(19, 16, 34, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .bg-radial-gradient {
            background: radial-gradient(circle at center, #231e40 0%, #131022 100%);
        }

        /* Gradient Text for the brand emphasis if needed */
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Button Gradient */
        .btn-primary-gradient {
            background: linear-gradient(135deg, #3713ec 0%, #5b37f2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary-gradient:hover {
            background: linear-gradient(135deg, #2a0eb5 0%, #4625cc 100%);
            box-shadow: 0 0 15px rgba(55, 19, 236, 0.4);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col relative overflow-hidden bg-radial-gradient">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[20%] w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[20%] w-[400px] h-[400px] bg-indigo-900/30 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<main class="flex-grow flex items-center justify-center p-4 z-10 w-full">
<div class="glass-panel w-full max-w-[440px] rounded-2xl p-8 sm:p-10 relative">
<!-- Header Section with Emblem -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl flex items-center justify-center border border-white/10 shadow-lg mb-6 group">
<span class="material-symbols-outlined text-primary text-4xl group-hover:scale-110 transition-transform duration-300">shield_person</span>
</div>
<h1 class="text-white text-2xl font-bold tracking-tight text-center mb-2">
                    Central de Seguridad
                </h1>
<p class="text-slate-400 text-sm font-medium text-center">
                    Iniciar sesión en el sistema CAD
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-slate-300 ml-1" for="email">
                        Correo Electrónico
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
</div>
<input autocomplete="username" class="block w-full rounded-lg border border-slate-700/50 bg-slate-900/50 text-white placeholder-slate-500 focus:border-primary focus:ring-1 focus:ring-primary pl-11 pr-4 py-3 sm:text-sm transition-all shadow-sm hover:border-slate-600" id="email" name="email" placeholder="funcionario@seguridad.cl" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-slate-300 ml-1" for="password">
                        Contraseña
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-primary transition-colors text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full rounded-lg border border-slate-700/50 bg-slate-900/50 text-white placeholder-slate-500 focus:border-primary focus:ring-1 focus:ring-primary pl-11 pr-10 py-3 sm:text-sm transition-all shadow-sm hover:border-slate-600" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex items-center justify-end">
<a class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full flex justify-center items-center py-3.5 px-4 rounded-lg text-sm font-semibold text-white btn-primary-gradient focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-primary shadow-lg shadow-indigo-500/20 group" type="button">
<span>Ingresar al Sistema</span>
<span class="material-symbols-outlined ml-2 text-[18px] group-hover:translate-x-1 transition-transform">login</span>
</button>
</form>
<!-- Additional Links / Help -->
<div class="mt-8 pt-6 border-t border-white/5 text-center">
<p class="text-xs text-slate-500">
                    Acceso restringido únicamente a personal autorizado.
                    <br/>
<span class="text-slate-600 mt-1 block">IP: 192.168.1.xxx detectada</span>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-6 text-center z-10">
<div class="flex flex-col items-center justify-center gap-2">
<p class="text-xs font-medium text-slate-500">
                Sistema CAD – Seguridad Municipal
            </p>
<p class="text-[10px] text-slate-600">
                © 2024 Todos los derechos reservados
            </p>
</div>
</footer>
</body></html>
